<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">Data cleaning pipeline: raw data to clean data</title>
<desc id="d">Raw customer rows with mixed date formats, casing errors and duplicates flow through profiling, validation, deduplication and standardization into a clean, ISO formatted dataset.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7c828d}
.h{font-weight:700;font-size:13px}
.s{font-size:10px}
.panel{fill:rgba(128,128,128,.07);stroke:rgba(128,128,128,.35)}
.bad{fill:rgba(239,68,68,.18)}
.neu{fill:rgba(128,128,128,.13)}
.good{fill:rgba(34,197,94,.18)}
.goodt{fill:#16a34a}
.flow{stroke:rgba(128,128,128,.55);stroke-width:2;stroke-dasharray:6 8;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.node{fill:rgba(128,128,128,.12);stroke:rgba(128,128,128,.55);stroke-width:1.5;animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
</style>
<text x="500" y="30" text-anchor="middle" class="h">DATA CLEANING PIPELINE</text>
<rect class="panel" x="20" y="50" width="280" height="300" rx="14"/>
<text class="h" x="36" y="76">raw_customers.csv</text>
<text class="s" x="284" y="76" text-anchor="end">5 rows</text>
<text class="s" x="32" y="104">name</text><text class="s" x="150" y="104">date</text><text class="s" x="222" y="104">country</text>
<rect class="bad" x="32" y="114" width="112" height="32" rx="5"/><rect class="bad" x="150" y="114" width="66" height="32" rx="5"/><rect class="bad" x="222" y="114" width="66" height="32" rx="5"/>
<text class="s" x="38" y="135">  emma johnson </text><text class="s" x="156" y="135">12/31/24</text><text class="s" x="228" y="135">usa</text>
<rect class="bad" x="32" y="158" width="112" height="32" rx="5"/><rect class="bad" x="150" y="158" width="66" height="32" rx="5"/><rect class="bad" x="222" y="158" width="66" height="32" rx="5"/>
<text class="s" x="38" y="179">E. Johnson</text><text class="s" x="156" y="179">31-Dec-24</text><text class="s" x="228" y="179">U.S.</text>
<rect class="bad" x="32" y="202" width="112" height="32" rx="5"/><rect class="bad" x="150" y="202" width="66" height="32" rx="5"/><rect class="neu" x="222" y="202" width="66" height="32" rx="5"/>
<text class="s" x="38" y="223">PRIYA SHARMA</text><text class="s" x="156" y="223">2024.11.05</text><text class="s" x="228" y="223">IN</text>
<rect class="neu" x="32" y="246" width="112" height="32" rx="5"/><rect class="bad" x="150" y="246" width="66" height="32" rx="5"/><rect class="bad" x="222" y="246" width="66" height="32" rx="5"/>
<text class="s" x="38" y="267">Priya Sharma</text><text class="s" x="156" y="267">NULL</text><text class="s" x="228" y="267">India</text>
<rect class="neu" x="32" y="290" width="112" height="32" rx="5"/><rect class="bad" x="150" y="290" width="66" height="32" rx="5"/><rect class="bad" x="222" y="290" width="66" height="32" rx="5"/>
<text class="s" x="38" y="311">Wei Chen</text><text class="s" x="156" y="311">03/15/24</text><text class="s" x="228" y="311">china</text>
<path class="flow" d="M300,200 L700,200"/>
<circle class="node" cx="355" cy="200" r="24"/><circle class="node" cx="445" cy="200" r="24" style="animation-delay:.6s"/><circle class="node" cx="535" cy="200" r="24" style="animation-delay:1.2s"/><circle class="node" cx="625" cy="200" r="24" style="animation-delay:1.8s"/>
<text class="h" x="355" y="205" text-anchor="middle">P</text><text class="h" x="445" y="205" text-anchor="middle">V</text><text class="h" x="535" y="205" text-anchor="middle">D</text><text class="h" x="625" y="205" text-anchor="middle">S</text>
<text class="s" x="355" y="246" text-anchor="middle">Profile</text><text class="s" x="445" y="246" text-anchor="middle">Validate</text><text class="s" x="535" y="246" text-anchor="middle">Dedupe</text><text class="s" x="625" y="246" text-anchor="middle">Standardize</text>
<circle r="5" fill="#ef4444"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M300,200 L700,200"/><animate attributeName="fill" values="#ef4444;#f59e0b;#22c55e" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#ef4444"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M300,200 L700,200"/><animate attributeName="fill" values="#ef4444;#f59e0b;#22c55e" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#ef4444"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M300,200 L700,200"/><animate attributeName="fill" values="#ef4444;#f59e0b;#22c55e" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
<rect class="panel" x="700" y="50" width="280" height="300" rx="14" style="stroke:#22c55e"/>
<text class="h" x="716" y="76">clean_customers.parquet</text>
<text class="s" x="964" y="76" text-anchor="end">3 rows</text>
<text class="s" x="712" y="104">name</text><text class="s" x="830" y="104">date</text><text class="s" x="922" y="104">ISO</text>
<rect class="good" x="712" y="114" width="112" height="32" rx="5"/><rect class="good" x="830" y="114" width="86" height="32" rx="5"/><rect class="good" x="922" y="114" width="46" height="32" rx="5"/>
<text class="s" x="718" y="135">Emma Johnson</text><text class="s" x="836" y="135">2024-12-31</text><text class="s" x="928" y="135">US</text>
<rect class="good" x="712" y="158" width="112" height="32" rx="5"/><rect class="good" x="830" y="158" width="86" height="32" rx="5"/><rect class="good" x="922" y="158" width="46" height="32" rx="5"/>
<text class="s" x="718" y="179">Priya Sharma</text><text class="s" x="836" y="179">2024-11-05</text><text class="s" x="928" y="179">IN</text>
<rect class="good" x="712" y="202" width="112" height="32" rx="5"/><rect class="good" x="830" y="202" width="86" height="32" rx="5"/><rect class="good" x="922" y="202" width="46" height="32" rx="5"/>
<text class="s" x="718" y="223">Wei Chen</text><text class="s" x="836" y="223">2024-03-15</text><text class="s" x="928" y="223">CN</text>
<text class="s goodt" x="716" y="268">✓ 2 duplicates merged</text><text class="s goodt" x="716" y="288">✓ dates → ISO 8601</text><text class="s goodt" x="716" y="308">✓ countries → ISO 3166</text><text class="s goodt" x="716" y="328">✓ nulls imputed + flagged</text>
<text class="s" x="500" y="382" text-anchor="middle">raw  →  profile  →  validate  →  deduplicate  →  standardize  →  analytics-ready</text>
</svg>
